openapi: 3.0.0
info:
  title: Health Diary API
  description: Health tracking API with JWT authentication, invite-only registration, and health record management
  version: 1.0.0
  contact:
    name: Health Diary Team

servers:
  - url: http://localhost:5000
    description: Local development server
  - url: https://health-diary.me
    description: Production server

paths:
  /api/auth/admin/invite:
    post:
      summary: Generate an invite link for a new user (Admin only)
      description: Creates a new invite link that can be sent to a user for registration. Only admin users can perform this operation.
      operationId: generateInviteLink
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateInviteRequest'
      responses:
        '201':
          description: Invite link successfully generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateInviteResponse'
        '401':
          description: Unauthorized - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/invite/validate:
    get:
      summary: Validate an invite link token
      description: Checks if an invite link token is valid, not expired, and has not been used already.
      operationId: validateInviteLink
      tags:
        - Authentication
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Invite token to validate
      responses:
        '200':
          description: Invite link is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid or expired invite link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/register:
    post:
      summary: Register a new user via invite link
      description: Creates a new user account using a valid invite link. The invite link must be valid and unused. Username must be unique and password must meet security requirements.
      operationId: registerUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Invalid request or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      summary: Authenticate user and issue tokens
      description: Authenticates a user with email and password, returning both an access token and refresh token. Rate limiting is applied to prevent brute force attacks.
      operationId: login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials or rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/token/refresh:
    post:
      summary: Refresh access token using refresh token
      description: Issues a new access token using a valid refresh token. The refresh token must not be expired or revoked.
      operationId: refreshAccessToken
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/admin/password-reset:
    post:
      summary: Request a password reset link (Admin generates for user)
      description: Generates a password reset link for a user. Only admin users can perform this operation. The link is sent to the user for password reset confirmation.
      operationId: generatePasswordResetLink
      tags:
        - Authentication
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: ID of user requesting password reset
      responses:
        '200':
          description: Password reset link generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetLinkResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/password-reset/confirm:
    post:
      summary: Reset password using reset link
      description: Resets a user's password using a valid password reset token. The token must not be expired or already used.
      operationId: resetPassword
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password successfully reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid reset token or password validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/health/medication:
    post:
      summary: Add a medication administration record
      description: Records a medication administration event with the date, time, medication name, and dosage. Requires authentication.
      operationId: createMedicationRecord
      tags:
        - Health Records
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationAdministrationDto'
      responses:
        '201':
          description: Medication record created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  message:
                    type: string
        '400':
          description: Date and Time are required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - Record could not be created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Valid access token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/health/bottle:
    post:
      summary: Add a bottle/hydration consumption record
      description: Records a hydration event including the date, time, and bottle size consumed. Helps track daily fluid intake. Requires authentication.
      operationId: createBottleRecord
      tags:
        - Health Records
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BottleConsumption'
      responses:
        '201':
          description: Bottle record created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  message:
                    type: string
        '400':
          description: Date and Time are required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - Record could not be created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Valid access token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/health/bowel-movement:
    post:
      summary: Add a bowel movement record
      description: Records a bowel movement event with the date, time, size, consistency, and color. Requires authentication.
      operationId: createBowelMovementRecord
      tags:
        - Health Records
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BowelMovement'
      responses:
        '201':
          description: Bowel movement record created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  message:
                    type: string
        '400':
          description: Date and Time are required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - Record could not be created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Valid access token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/health/solid-food:
    post:
      summary: Add a solid food consumption record
      description: Records solid food consumption with the date, time, food item, and size. Tracks dietary intake. Requires authentication.
      operationId: createSolidFoodRecord
      tags:
        - Health Records
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolidFoodConsumption'
      responses:
        '201':
          description: Solid food record created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  message:
                    type: string
        '400':
          description: Date and Time are required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - Record could not be created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Valid access token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/health/note:
    post:
      summary: Add a note/observation record
      description: Records a general note or observation with the date, time, and note content. Allows free-form health tracking. Requires authentication.
      operationId: createNoteRecord
      tags:
        - Health Records
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Observation'
      responses:
        '201':
          description: Note record created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  message:
                    type: string
        '400':
          description: Date and Time are required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - Record could not be created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Valid access token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/health/medications/dosage-groups:
    get:
      summary: Retrieve all medication dosage groups
      description: Retrieves all configured medication dosage groups organised by schedule. Used by the UI to populate medication selection lists. Requires authentication.
      operationId: getAllMedicationDosageGroups
      tags:
        - Health Records
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Medication dosage groups retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicationDosageGroup'
        '401':
          description: Unauthorized - Valid access token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/health/summary/{date}:
    get:
      summary: Retrieve daily summary for a given date
      description: Retrieves all health records for a specific date, organized by record type (medications, hydration, bowel movements, food, observations). Requires authentication.
      operationId: getSummaryByDate
      tags:
        - Health Records
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
          description: Date in yyyy-MM-dd format
      responses:
        '200':
          description: Daily summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySummary'
        '400':
          description: Invalid date format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Valid access token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health:
    get:
      summary: Health check endpoint
      description: Simple health check endpoint for container monitoring. Returns healthy status with timestamp.
      operationId: healthCheck
      tags:
        - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time

components:
  schemas:
    # Authentication Request/Response Schemas
    GenerateInviteRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email address for the invite

    GenerateInviteResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: Unique invite token
        email:
          type: string
          format: email
        expiresAt:
          type: string
          format: date-time
        message:
          type: string

    RegisterRequest:
      type: object
      required:
        - inviteToken
        - email
        - username
        - name
        - password
      properties:
        inviteToken:
          type: string
          description: Unique invite token
        email:
          type: string
          format: email
          description: User email address
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9_-]+$'
          description: Unique username
        name:
          type: string
          description: User's full name
        password:
          type: string
          minLength: 8
          description: Password (min 8 characters)

    RegisterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        message:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          description: User password

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: JWT refresh token
        refreshTokenExpiresAt:
          type: string
          format: date-time
        message:
          type: string

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh token

    RefreshTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: New JWT access token
        expiresAt:
          type: string
          format: date-time
        message:
          type: string

    PasswordResetLinkResponse:
      type: object
      properties:
        token:
          type: string
          description: Reset token
        expiresAt:
          type: string
          format: date-time
        message:
          type: string

    ResetPasswordRequest:
      type: object
      required:
        - resetToken
        - newPassword
      properties:
        resetToken:
          type: string
          description: Password reset token
        newPassword:
          type: string
          minLength: 8
          description: New password (min 8 characters)

    # Medication Reference Data Schemas
    MedicationDosage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        medication:
          type: string
          description: Name of the medication
        dosage:
          type: string
          description: Dosage amount (e.g. "4ml", "300mg")

    MedicationDosageGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        medicationDosage:
          $ref: '#/components/schemas/MedicationDosage'
        schedule:
          type: string
          enum:
            - SevenAm
            - ThreePm
            - SevenPm
            - TenPm
            - AdHoc
          description: The scheduled administration time for this medication dosage

    # Health Record Schemas
    MedicationAdministrationDto:
      type: object
      required:
        - date
        - time
      properties:
        date:
          type: string
          format: date
          description: Date of medication administration (yyyy-MM-dd)
        time:
          type: string
          format: time
          description: Time of medication administration (HH:mm)
        timezoneOffsetMinutes:
          type: integer
          default: 0
          description: Timezone offset from UTC in minutes. Positive values are east of UTC, negative values are west. For example UTC+2 = 120, UTC-5 = -300
        medication:
          type: string
          default: ''
          description: Name of medication
        dosage:
          type: string
          default: ''
          description: Dosage amount (e.g. "4ml", "300mg")
        schedule:
          type: string
          default: ''
          description: Schedule key (e.g. "SevenAm", "ThreePm", "SevenPm", "TenPm", "AdHoc")

    MedicationAdministration:
      type: object
      required:
        - date
        - time
      properties:
        date:
          type: string
          format: date
          description: Date of medication
        time:
          type: string
          format: time
          description: Time of medication administration
        timezoneOffsetMinutes:
          type: integer
          default: 0
          description: Timezone offset from UTC in minutes. Positive values are east of UTC, negative values are west. For example UTC+2 = 120, UTC-5 = -300
        medication:
          type: string
          description: Name of medication
        dosage:
          type: string
          description: Dosage amount
        schedule:
          type: string
          enum:
            - SevenAm,
            - ThreePm,
            - SevenPm,
            - TenPm,
            - AdHoc

    BottleConsumption:
      type: object
      required:
        - date
        - time
      properties:
        date:
          type: string
          format: date
          description: Date of consumption
        time:
          type: string
          format: time
          description: Time of consumption
        timezoneOffsetMinutes:
          type: integer
          default: 0
          description: Timezone offset from UTC in minutes. Positive values are east of UTC, negative values are west. For example UTC+2 = 120, UTC-5 = -300
        bottleSize:
          type: integer
          description: Amount consumed in ml

    BowelMovement:
      type: object
      required:
        - date
        - time
        - size
        - consistency
        - color
      properties:
        date:
          type: string
          format: date
          description: Date of bowel movement
        time:
          type: string
          format: time
          description: Time of bowel movement
        timezoneOffsetMinutes:
          type: integer
          default: 0
          description: Timezone offset from UTC in minutes. Positive values are east of UTC, negative values are west. For example UTC+2 = 120, UTC-5 = -300
        size:
          type: string
          description: Size of bowel movement
        consistency:
          type: string
          description: Consistency of bowel movement
        color:
          type: string
          description: Color of bowel movement

    SolidFoodConsumption:
      type: object
      required:
        - date
        - time
        - item
        - size
      properties:
        date:
          type: string
          format: date
          description: Date of food consumption
        time:
          type: string
          format: time
          description: Time of food consumption
        timezoneOffsetMinutes:
          type: integer
          default: 0
          description: Timezone offset from UTC in minutes. Positive values are east of UTC, negative values are west. For example UTC+2 = 120, UTC-5 = -300
        item:
          type: string
          description: Description of food item consumed
        size:
          type: string
          description: Size or quantity of food consumed

    Observation:
      type: object
      required:
        - date
        - time
        - note
      properties:
        date:
          type: string
          format: date
          description: Date of observation
        time:
          type: string
          format: time
          description: Time of observation
        timezoneOffsetMinutes:
          type: integer
          default: 0
          description: Timezone offset from UTC in minutes. Positive values are east of UTC, negative values are west. For example UTC+2 = 120, UTC-5 = -300
        note:
          type: string
          description: Observation notes/text

    DailySummary:
      type: object
      properties:
        date:
          type: string
          format: date
          description: The date for this summary
        healthEntrySets:
          type: array
          items:
            $ref: '#/components/schemas/HealthEntrySet'
          description: Grouped health records by type

    HealthEntrySet:
      type: object
      properties:
        recordType:
          type: string
          description: The type of health record (e.g., MedicationAdministration)
        highlights:
          type: array
          items:
            $ref: '#/components/schemas/Highlight'
        records:
          type: array
          items:
            $ref: '#/components/schemas/HealthRecord'

    Highlight:
      type: object
      properties:
        label:
          type: string
          description: The label for the highlight (e.g., SevenAm, ThreePm)
        status:
          type: string
          enum: [success, warning, error, default]
          default: default
          description: Status indicator for the highlight

    HealthRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        time:
          type: string
          format: time
        recordType:
          type: string
        summary:
          type: string

    Error:
      type: object
      required:
        - message
      properties:
        statusCode:
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        details:
          type: array
          items:
            type: string
          description: Optional list of detailed error messages

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token for authenticated endpoints

tags:
  - name: Authentication
    description: User registration, login, and token management
  - name: Health Records
    description: Health tracking records and summaries
  - name: System
    description: System monitoring and health check endpoints

